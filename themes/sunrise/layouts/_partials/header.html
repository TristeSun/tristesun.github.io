<header class="site-header">
  <nav class="wrap nav">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="返回首页">
      <svg class="brand__mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
        <path d="M32 20a13 13 0 0 1 13 13H19a13 13 0 0 1 13-13z" fill="currentColor"/>
        <path d="M10 38h44" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M32 8v5M17 13l3.6 3.6M47 13l-3.6 3.6" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
      <span class="brand__name">{{ site.Title }}</span>
    </a>

    <ul class="menu">
      {{- range .Site.Menus.main }}
      <li><a class="menu__link {{ if or ($.IsMenuCurrent `main` .) ($.HasMenuCurrent `main` .) }}is-active{{ end }}" href="{{ .URL }}">{{ .Name }}</a></li>
      {{- end }}
    </ul>

    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换明暗主题">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7.5 7.5 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
  </nav>
</header>
