{{- /* 文章卡片：纯文字行式布局 */}}
<article class="post-card">
  <a class="post-card__date" href="{{ .RelPermalink }}">{{ .Date.Format "2006-01-02" }}</a>
  <h2 class="post-card__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p class="post-card__summary">{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 90 }}{{ end }}</p>
  {{- with .GetTerms "tags" }}
  <div class="post-card__tags">
    {{- range . }}<a class="tag-chip" href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end -}}
  </div>
  {{- end }}
</article>
